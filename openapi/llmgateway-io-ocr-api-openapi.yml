openapi: 3.2.0
info:
  version: 1.0.0
  title: LLM Gateway Ocr API
  description: 'OpenAI-compatible LLM gateway: chat completions, embeddings, images, audio, video, moderation, OCR, rerank, web search and typed decisions across providers with one API key.'
servers:
- url: https://api.llmgateway.io
- url: http://localhost:4001
tags:
- name: OCR
paths:
  /v1/ocr:
    post:
      operationId: v1_ocr
      summary: OCR
      description: Extract text and structure from a document or image as markdown using an OCR model.
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  description: ID of the OCR model to use.
                  example: mistral-ocr-latest
                document:
                  anyOf:
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - document_url
                      document_url:
                        type: string
                        description: URL or data URL of the PDF/document to process.
                        example: https://arxiv.org/pdf/2201.04234
                      document_name:
                        type: string
                    required:
                    - type
                    - document_url
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - image_url
                      image_url:
                        anyOf:
                        - type: string
                        - type: object
                          properties:
                            url:
                              type: string
                          required:
                          - url
                        description: URL or data URL of the image to process, or an object with a `url` field.
                    required:
                    - type
                    - image_url
                  description: The document or image to run OCR on.
                id:
                  type: string
                pages:
                  anyOf:
                  - type: array
                    items:
                      type: integer
                  - type: string
                  description: Specific pages to process, as a list of page indices or a range string (e.g. '0-5').
                include_image_base64:
                  type: boolean
                  description: Whether to return extracted images as base64 in the response.
                image_limit:
                  type: integer
                image_min_size:
                  type: integer
                bbox_annotation_format:
                  type: object
                  additionalProperties: {}
                document_annotation_format:
                  type: object
                  additionalProperties: {}
              required:
              - model
              - document
      responses:
        '200':
          description: OCR response.
          headers:
            RateLimit-Policy:
              schema:
                type: string
              description: Quota policy as an HTTP Structured Fields list, e.g. "requests";q=60;w=60.
            RateLimit:
              schema:
                type: string
              description: Available quota and reset delay, e.g. "requests";r=59;t=60.
            RateLimit-Limit:
              schema:
                type: string
              description: Request limit for the current window.
            RateLimit-Remaining:
              schema:
                type: string
              description: Requests remaining in the current window.
            RateLimit-Reset:
              schema:
                type: string
              description: Seconds until the current window resets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pages:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        markdown:
                          type: string
                        images:
                          type: array
                          items:
                            type: object
                            additionalProperties: {}
                        dimensions:
                          type:
                          - object
                          - 'null'
                          additionalProperties: {}
                  model:
                    type: string
                  document_annotation:
                    type:
                    - string
                    - 'null'
                  usage_info:
                    type: object
                    properties:
                      pages_processed:
                        type: integer
                      doc_size_bytes:
                        type:
                        - integer
                        - 'null'
                description: OCR response payload returned by the upstream provider.
        '400':
          description: Invalid request body or parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '402':
          description: Insufficient credits or plan limits reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '403':
          description: Forbidden request or upstream response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '404':
          description: Unknown model or upstream not-found response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '408':
          description: Request timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '410':
          description: Archived or unavailable project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '413':
          description: Request too large.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '415':
          description: Unsupported media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '429':
          description: Rate limited. Response headers describe only LLMGateway-enforced limits; upstream provider headers are not forwarded. Honor Retry-After when present.
          headers:
            RateLimit-Policy:
              schema:
                type: string
              description: Quota policy as an HTTP Structured Fields list, e.g. "requests";q=60;w=60.
            RateLimit:
              schema:
                type: string
              description: Available quota and reset delay, e.g. "requests";r=59;t=60.
            RateLimit-Limit:
              schema:
                type: string
              description: Request limit for the current window.
            RateLimit-Remaining:
              schema:
                type: string
              description: Requests remaining in the current window.
            RateLimit-Reset:
              schema:
                type: string
              description: Seconds until the current window resets.
            Retry-After:
              schema:
                type: string
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '502':
          description: Failed to connect to the upstream provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '503':
          description: Service unavailable upstream response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '504':
          description: Upstream provider timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '529':
          description: Gateway overloaded.
          headers:
            Retry-After:
              schema:
                type: string
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
      tags:
      - OCR
components:
  schemas:
    OpenAIError:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
            param:
              type:
              - string
              - 'null'
            code:
              type:
              - string
              - 'null'
          required:
          - message
          - type
          - param
          - code
      required:
      - error
      description: OpenAI-compatible error object.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token authentication using API keys
externalDocs:
  url: https://docs.llmgateway.io
  description: LLMGateway Documentation
