aid: llmgateway-io
name: LLM Gateway
image: https://llmgateway.io/opengraph-image?6e44604ced30de3d
description: 'LLM Gateway is an OpenAI-compatible LLM gateway: one API key routes chat completions, embeddings, images, audio,
  video, moderation, OCR, rerank, web search and typed decisions across model providers. It publishes an OpenAPI 3.0 contract
  at https://api.llmgateway.io/openapi.json, which includes POST /v1/decisions (OpenAI-compatible typed, probabilistic decisions)
  and POST /v1/systemone (the TypeSafe System One-compatible endpoint, documented as legacy and to be deprecated in favor
  of /v1/decisions). An MCP server (Streamable HTTP) is served at /mcp with OAuth metadata at /.well-known/oauth-authorization-server
  and /.well-known/oauth-protected-resource.'
